[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/commands",
    "crates/core",
    "crates/markdown",
    "crates/platform",
    "crates/textproc",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/CMSpeedAU/NoteCraft"
authors = ["TextCraft contributors"]

[workspace.dependencies]
nc-commands = { path = "crates/commands" }
nc-core = { path = "crates/core" }
nc-markdown = { path = "crates/markdown" }
nc-platform = { path = "crates/platform" }
nc-textproc = { path = "crates/textproc" }

anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1.12"

# The portable window backend (`nc-platform`'s `egui` feature). Pinned to the
# version the port was written against.
eframe = "0.36"
egui = "0.36"
# The operating system's own Open / Save As dialogs.
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }

# Shared egui components from the Craft suite (icons, tab fitting, toolbar fitting).
# Pinned to the revision GridCraft builds against.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "d27646a5f7c8b4fc85d9dd3213b8c88b58e0088d" }

# Test-only. `proptest` is used for the property tests named in
# `docs/test-strategy.md` §5.
proptest = "1.6"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
